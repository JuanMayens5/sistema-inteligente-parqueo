; =============================================================================
;  Configuración del Sistema Inteligente de Parqueo (PLANTILLA)
;
;  Copia este archivo como "config_db.ini" y ajústalo a tu computadora.
;  config_db.ini NO se sube al repositorio porque puede llevar contraseñas.
;  Si falta config_db.ini, la aplicación usa estos mismos valores por defecto.
; =============================================================================

[datos]
; De dónde salen los datos:
;   sqlserver -> base real SistemaInteligenteParqueo (database.sql)
;   mock      -> modo demostración, datos en memoria (no necesita SQL Server)
origen = sqlserver

[sqlserver]
driver = ODBC Driver 18 for SQL Server
servidor = localhost
base_datos = SistemaInteligenteParqueo
; windows -> usa tu usuario de Windows, sin contraseña
; sql     -> usa usuario y contraseña de SQL Server
autenticacion = windows
usuario =
; Mejor no escribir la contraseña aquí: usa la variable de entorno
; PARQUEO_DB_CONTRASENA, que tiene prioridad sobre este valor.
contrasena =

[operacion]
; Nombre que se guarda en la base al autorizar salidas o apagar alarmas
; (columnas autorizado_por y apagada_por).
operador = CONTROL
; Cada cuántos milisegundos se vuelve a leer el estado del parqueo, para ver
; cambios hechos desde otra ventana, la consola o el hardware.
refresco_ms = 3000
